[package]
name = "scanpro"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Scan paper to searchable PDFs and more, with any scanner, on any desktop OS."
license = "GPL-3.0-or-later"
default-run = "scanpro"

[lib]
name = "scanpro"
path = "src/lib.rs"

[[bin]]
name = "scanpro"
path = "src/main.rs"

[features]
default = ["ocrs-engine"]
# Pure-Rust OCR (ocrs). The only OCR engine on Linux, and the cross-platform
# fallback elsewhere. Models (~12 MB) are downloaded on first use.
ocrs-engine = ["dep:ocrs", "dep:rten"]

[dependencies]
slint = "1.18"
rfd = "0.17"

anyhow = "1"
base64 = "0.22"
ctrlc = "3"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.6", features = ["derive"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
jiff = { version = "0.2", features = ["serde"] }
regex = "1"

rayon = "1.12"
crossbeam-channel = "0.5"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "pnm", "rayon"] }
tiff = "0.11"
pdf-writer = "0.15"
flate2 = "1"

libloading = "0.9"
ureq = { version = "3", features = ["json"] }
mdns-sd = "0.21"
roxmltree = "0.21"

ocrs = { version = "0.13", optional = true }
rten = { version = "0.26", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"
objc2-image-capture-core = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Console",
    "Win32_System_Variant",
    "Win32_Devices_ImageAcquisition",
    "Win32_UI_Shell",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
] }
# `#[implement]` (COM callbacks, e.g. the WIA transfer sink) expands to
# `::windows_core` paths, so it must be a direct dependency.
windows-core = "0.62"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Image decoding/encoding and OCR are unusably slow unoptimised; keep debug
# builds of dependencies fast while our own code stays debuggable.
[profile.dev.package."*"]
opt-level = 3

# ─── Native installers ────────────────────────────────────────────────────
# `cargo packager --release` on each OS produces that OS's installers.
[package.metadata.packager]
product-name = "ScanPro"
identifier = "com.mica-alex.scanpro"
category = "Productivity"
copyright = "Copyright © 2026 Alex H"
description = "Scan paper to searchable PDFs and more, with any scanner."
before-packaging-command = "cargo build --release"
out-dir = "dist"
binaries = [{ path = "scanpro", main = true }]
icons = ["assets/icons/32x32.png", "assets/icons/128x128.png", "assets/icons/256x256.png", "assets/icons/512x512.png", "assets/icons/icon.icns", "assets/icons/icon.ico"]

[package.metadata.packager.macos]
minimum-system-version = "12.0"
# Ad-hoc ("-") signature: seals the whole bundle so it runs cleanly on this
# Mac. Replace with a Developer ID identity to distribute (needs notarizing).
signing-identity = "-"
entitlements = "assets/macos/entitlements.plist"
info-plist-path = "assets/macos/Info.plist"

[package.metadata.packager.deb]
depends = ["libsane1"]

[package.metadata.packager.windows]
allow-downgrades = false
